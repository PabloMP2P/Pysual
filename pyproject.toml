[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pysual"
dynamic = ["version"]
description = "Python interfaces for native windows, terminals, and the web"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{name = "Pysual contributors"}]
keywords = ["gui", "ui", "widgets", "sdl3", "terminal", "tui", "svg", "web", "pyodide"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]

[project.scripts]
pysual = "pysual.cli:main"

[project.urls]
Repository = "https://github.com/PabloMP2P/Pysual"
Documentation = "https://github.com/PabloMP2P/Pysual/blob/main/docs/api.md"
Issues = "https://github.com/PabloMP2P/Pysual/issues"

[project.optional-dependencies]
build = ["pyinstaller>=6.16,<7", "build>=1.2", "setuptools>=77"]
dev = ["pytest>=8", "pillow>=10", "setuptools>=77", "playwright>=1.55,<2", "pyright>=1.1.414,<2"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
# One version source: setuptools reads the literal statically, without importing.
version = {attr = "pysual.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pysual", "pysual.*"]
namespaces = false

[tool.setuptools.package-data]
pysual = ["py.typed", "*.pyi", "assets/*", "bin/*", "web/*.js", "web/*.html", "web/notices/*.txt", "web/notices/manifest.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
